networks:
  camvision-net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  openclip_cache:

services:
  db:
    image: postgres:16-alpine
    container_name: camvision_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - camvision-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  vector-db:
    image: qdrant/qdrant:latest
    container_name: camvision_qdrant
    restart: always
    ports:
      - "${QDRANT_PORT}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - camvision-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: camvision_backend
    restart: always
    ports:
      - "${BACKEND_PORT}:8000"
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - QDRANT_HOST=vector-db
      - QDRANT_PORT=6333
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-camvision-dev-secret-change-me-in-production}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-60}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@camvision.cm}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-motdepasseadmin}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ./backend:/app
      - openclip_cache:/root/.cache
    depends_on:
      db:
        condition: service_healthy
      vector-db:
        condition: service_started
    networks:
      - camvision-net
